<?xml version="1.0" encoding="UTF-8"?>
<!-- reKing: the controller on the help screen shown while a level loads, drawn for this port (original art, GPL-3.0
     with the rest of reKing). A PlayStation-layout pad in the screen's own space (3840x2160, as the player sees it).
     It stands where the Xbox picture's controller stood: the face buttons on the Xbox's A/B/X/Y, the triggers under
     the game's L2/R2 labels. tools/mkcontroller.py turns it into ps5/art/controller.png, the picture's own space. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <path id="body" d="M 1545 455 C 1350 452 1050 440 880 470 C 760 492 705 560 690 660 C 670 820 690 1050 760 1210
      C 800 1300 880 1345 960 1335 C 1040 1325 1080 1270 1120 1180 C 1170 1080 1260 1060 1380 1060 L 1710 1060
      C 1830 1060 1920 1080 1970 1180 C 2010 1270 2050 1325 2130 1335 C 2210 1345 2290 1300 2330 1210
      C 2400 1050 2420 820 2400 660 C 2385 560 2330 492 2210 470 C 2040 440 1740 452 1545 455 Z"/>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="95"/>
    </filter>
    <filter id="glowNear" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#505256"/>
      <stop offset="0.35" stop-color="#3f4144"/>
      <stop offset="1" stop-color="#252629"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55575b"/>
      <stop offset="1" stop-color="#3a3c3f"/>
    </linearGradient>
    <linearGradient id="trigger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d4f53"/>
      <stop offset="1" stop-color="#222326"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#4b4d51"/>
      <stop offset="0.7" stop-color="#2e2f32"/>
      <stop offset="1" stop-color="#1f2022"/>
    </radialGradient>
    <radialGradient id="button" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3a3c40"/>
      <stop offset="1" stop-color="#18191b"/>
    </radialGradient>
    <clipPath id="bodyClip"><use href="#body"/></clipPath>
  </defs>

  <rect width="3840" height="2160" fill="#000"/>

  <!-- the halo: teal, as the Xbox picture's -->
  <use href="#body" fill="#2f9aa0" opacity="0.85" filter="url(#glow)" transform="translate(1545 900) scale(1.12) translate(-1545 -900)"/>
  <use href="#body" fill="#2b8a90" opacity="0.6" filter="url(#glowNear)"/>

  <!-- triggers (L2 / R2), behind the shell -->
  <rect x="905" y="392" width="330" height="120" rx="48" fill="url(#trigger)" stroke="#5c5f63" stroke-width="4"/>
  <rect x="1855" y="392" width="330" height="120" rx="48" fill="url(#trigger)" stroke="#5c5f63" stroke-width="4"/>

  <!-- the shell -->
  <use href="#body" fill="url(#shell)"/>
  <g clip-path="url(#bodyClip)">
    <!-- a soft light along the top, a shade along the grips -->
    <use href="#body" fill="none" stroke="#8a8d91" stroke-width="10" opacity="0.55" filter="url(#soft)" transform="translate(0 6)"/>
    <ellipse cx="1545" cy="1330" rx="900" ry="190" fill="#000" opacity="0.25" filter="url(#glowNear)"/>
  </g>
  <use href="#body" fill="none" stroke="#6b6e72" stroke-width="5"/>

  <!-- bumpers (L1 / R1) on the top edge -->
  <rect x="915" y="452" width="310" height="34" rx="17" fill="#34363a" stroke="#6b6e72" stroke-width="4"/>
  <rect x="1865" y="452" width="310" height="34" rx="17" fill="#34363a" stroke="#6b6e72" stroke-width="4"/>

  <!-- touch pad, with the two small buttons beside it -->
  <rect x="1300" y="478" width="490" height="262" rx="46" fill="url(#pad)" stroke="#6b6e72" stroke-width="4"/>
  <rect x="1225" y="500" width="28" height="64" rx="14" fill="#1d1e20" stroke="#6b6e72" stroke-width="4"/>
  <rect x="1837" y="500" width="28" height="64" rx="14" fill="#1d1e20" stroke="#6b6e72" stroke-width="4"/>

  <!-- d-pad (left), where the face buttons are mirrored -->
  <circle cx="1084" cy="668" r="168" fill="#2b2c2f" stroke="#3f4145" stroke-width="4"/>
  <g fill="url(#button)" stroke="#5a5d61" stroke-width="4">
    <rect x="1051" y="530" width="66" height="112" rx="16"/>
    <rect x="1051" y="694" width="66" height="112" rx="16"/>
    <rect x="946" y="635" width="112" height="66" rx="16"/>
    <rect x="1110" y="635" width="112" height="66" rx="16"/>
  </g>
  <g fill="#c9ccd0">
    <path d="M 1084 552 L 1104 584 L 1064 584 Z"/>
    <path d="M 1084 784 L 1104 752 L 1064 752 Z"/>
    <path d="M 968 668 L 1000 648 L 1000 688 Z"/>
    <path d="M 1200 668 L 1168 648 L 1168 688 Z"/>
  </g>

  <!-- face buttons, on the Xbox picture's Y / X / B / A -->
  <circle cx="2006" cy="668" r="168" fill="#2b2c2f" stroke="#3f4145" stroke-width="4"/>
  <g fill="url(#button)" stroke="#5a5d61" stroke-width="4">
    <circle cx="2009" cy="574" r="50"/>
    <circle cx="1883" cy="668" r="50"/>
    <circle cx="2127" cy="668" r="50"/>
    <circle cx="2005" cy="761" r="50"/>
  </g>
  <g fill="none" stroke="#dfe2e6" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 2009 549 L 2033 590 L 1985 590 Z"/>
    <rect x="1863" y="648" width="40" height="40"/>
    <circle cx="2127" cy="668" r="22"/>
    <path d="M 1986 742 L 2024 780 M 2024 742 L 1986 780"/>
  </g>

  <!-- sticks -->
  <g>
    <circle cx="1290" cy="905" r="108" fill="#151618" stroke="#3f4145" stroke-width="4"/>
    <circle cx="1290" cy="905" r="80" fill="url(#cap)" stroke="#5a5d61" stroke-width="4"/>
    <circle cx="1290" cy="905" r="56" fill="none" stroke="#24252800" stroke-width="0"/>
    <circle cx="1290" cy="905" r="54" fill="#2a2b2e" opacity="0.7"/>
    <circle cx="1800" cy="905" r="108" fill="#151618" stroke="#3f4145" stroke-width="4"/>
    <circle cx="1800" cy="905" r="80" fill="url(#cap)" stroke="#5a5d61" stroke-width="4"/>
    <circle cx="1800" cy="905" r="54" fill="#2a2b2e" opacity="0.7"/>
  </g>

  <!-- the centre button -->
  <circle cx="1545" cy="830" r="30" fill="#1d1e20" stroke="#6b6e72" stroke-width="4"/>
</svg>
